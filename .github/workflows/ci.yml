name: Continuous Integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/cloudflare-worker-preview-manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 11.17.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 22.16.0 }
      - name: Resolve runtime upgrade metadata without executing dependency scripts
        run: pnpm --filter @protostack/web update @opennextjs/cloudflare@1.20.12 wrangler@4.148.0 --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v6
        with:
          name: proposed-runtime-lockfile
          path: |
            pnpm-lock.yaml
            apps/web/package.json
          retention-days: 3
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 11.17.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 22.16.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - name: Build Cloudflare Worker
        run: pnpm --filter @protostack/web build:worker
      - name: Smoke test Worker startup
        shell: bash
        run: |
          pnpm --filter @protostack/web exec wrangler dev --env staging --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/worker-smoke.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          if ! node scripts/check-worker-startup.mjs; then
            cat "$RUNNER_TEMP/worker-smoke.log"
            exit 1
          fi
      - run: pnpm audit --audit-level=high --prod
  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 11.17.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 22.16.0 }
      - uses: supabase/setup-cli@v2
        with: { version: 2.109.1 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset
      - run: pnpm db:lint
      - run: pnpm db:test
      - run: pnpm playwright:install
      - run: pnpm test:browsers
      - if: failure()
        uses: actions/upload-artifact@v6
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
      - if: always()
        run: supabase stop --no-backup
