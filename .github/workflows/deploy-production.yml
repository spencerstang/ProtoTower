name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      expected_git_sha:
        description: "Exact accepted main commit to deploy"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY INVITE-ONLY PRODUCTION"
        required: true
        type: string
      deploy_database:
        description: "Apply committed migrations and the reviewed synthetic catalog seed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate production authorization
        shell: bash
        env:
          CONFIRMATION: "${{ inputs.confirmation }}"
          EXPECTED_GIT_SHA: "${{ inputs.expected_git_sha }}"
          ACTUAL_GIT_SHA: "${{ github.sha }}"
          ACTUAL_REF: "${{ github.ref }}"
        run: |
          test "$ACTUAL_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "DEPLOY INVITE-ONLY PRODUCTION"
          test "$EXPECTED_GIT_SHA" = "$ACTUAL_GIT_SHA"

  validate:
    needs: authorize
    uses: ./.github/workflows/reusable-verify.yml

  migrate:
    if: inputs.deploy_database
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Validate production database inputs
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          SUPABASE_PROJECT_ID: "${{ secrets.SUPABASE_PROJECT_ID }}"
          SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Link production database
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_ID"
          --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          SUPABASE_PROJECT_ID: "${{ secrets.SUPABASE_PROJECT_ID }}"
          SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Apply committed production migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"

  deploy-web:
    needs: [validate, migrate]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate production web inputs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          ADMIN_DIAGNOSTICS_TOKEN: "${{ secrets.ADMIN_DIAGNOSTICS_TOKEN }}"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
          SUPABASE_PROJECT_ID: "${{ secrets.SUPABASE_PROJECT_ID }}"
          PUBLIC_APP_URL: "${{ vars.PUBLIC_APP_URL }}"
          PUBLIC_SUPPORT_EMAIL: "${{ vars.PUBLIC_SUPPORT_EMAIL }}"
          DEPLOYMENT_HEALTH_URL: "${{ vars.DEPLOYMENT_HEALTH_URL }}"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#ADMIN_DIAGNOSTICS_TOKEN}" -ge 32
          test "${#SUPABASE_ANON_KEY}" -ge 20
          test "$PUBLIC_APP_URL" = "https://prototower.ai"
          case "$PUBLIC_SUPPORT_EMAIL" in
            *@prototower.ai) ;;
            *) echo "PUBLIC_SUPPORT_EMAIL must use the prototower.ai domain" >&2; exit 1 ;;
          esac
          case "$DEPLOYMENT_HEALTH_URL" in
            https://prototower.ai|https://protostack-web-production.spencer-4e6.workers.dev) ;;
            *) echo "DEPLOYMENT_HEALTH_URL must identify the reviewed production Worker or canonical origin" >&2; exit 1 ;;
          esac
          test "$SUPABASE_URL" = "https://${SUPABASE_PROJECT_ID}.supabase.co"
      - name: Set build metadata
        id: metadata
        shell: bash
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Prepare production Worker configuration
        shell: bash
        env:
          APP_VERSION: "0.2.0"
          BUILD_TIME: "${{ steps.metadata.outputs.build_time }}"
          GIT_SHA: "${{ github.sha }}"
          PUBLIC_APP_URL: "${{ vars.PUBLIC_APP_URL }}"
          PUBLIC_SUPPORT_EMAIL: "${{ vars.PUBLIC_SUPPORT_EMAIL }}"
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const ts = require("typescript");
          const path = "apps/web/wrangler.jsonc";
          const { config, error } = ts.parseConfigFileTextToJson(
            path,
            fs.readFileSync(path, "utf8"),
          );
          if (error) {
            throw new Error(
              ts.flattenDiagnosticMessageText(error.messageText, "\n"),
            );
          }
          const production = config.env.production.vars;
          production.APP_VERSION = process.env.APP_VERSION;
          production.BUILD_TIME = process.env.BUILD_TIME;
          production.GIT_SHA = process.env.GIT_SHA;
          production.PUBLIC_APP_URL = process.env.PUBLIC_APP_URL;
          production.PUBLIC_SUPPORT_EMAIL = process.env.PUBLIC_SUPPORT_EMAIL;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - name: Build OpenNext Worker
        run: pnpm --filter @protostack/web exec opennextjs-cloudflare build
        env:
          APP_ENV: production
          APP_VERSION: "0.2.0"
          BUILD_TIME: "${{ steps.metadata.outputs.build_time }}"
          GIT_SHA: "${{ github.sha }}"
          PUBLIC_APP_URL: "${{ vars.PUBLIC_APP_URL }}"
          PUBLIC_SUPPORT_EMAIL: "${{ vars.PUBLIC_SUPPORT_EMAIL }}"
          ADMIN_DIAGNOSTICS_TOKEN: "${{ secrets.ADMIN_DIAGNOSTICS_TOKEN }}"
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_APP_NAME: ProtoTower
      - name: Upload production Worker runtime secrets
        shell: bash
        env:
          ADMIN_DIAGNOSTICS_TOKEN: "${{ secrets.ADMIN_DIAGNOSTICS_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
        run: |
          printf '%s' "$ADMIN_DIAGNOSTICS_TOKEN" |
            pnpm --filter @protostack/web exec wrangler secret put \
              ADMIN_DIAGNOSTICS_TOKEN --env production
          printf '%s' "$SUPABASE_URL" |
            pnpm --filter @protostack/web exec wrangler secret put \
              SUPABASE_URL --env production
          printf '%s' "$SUPABASE_ANON_KEY" |
            pnpm --filter @protostack/web exec wrangler secret put \
              SUPABASE_ANON_KEY --env production
      - name: Deploy production Worker without DNS cutover
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          workingDirectory: apps/web
          wranglerVersion: "4.114.0"
          command: deploy --env production
      - name: Verify production Worker endpoints
        shell: bash
        env:
          ADMIN_DIAGNOSTICS_TOKEN: "${{ secrets.ADMIN_DIAGNOSTICS_TOKEN }}"
          EXPECTED_GIT_SHA: "${{ github.sha }}"
          DEPLOYMENT_HEALTH_URL: "${{ vars.DEPLOYMENT_HEALTH_URL }}"
        run: |
          node <<'NODE'
          const baseUrl = process.env.DEPLOYMENT_HEALTH_URL.replace(/\/$/, "");
          const sleep = (milliseconds) =>
            new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function fetchWithRetry(path, init, isExpected) {
            let lastError;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              try {
                const response = await fetch(`${baseUrl}${path}`, init);
                const body = await response.text();
                if (!response.ok) {
                  throw new Error(`${path} returned ${response.status}`);
                }
                if (isExpected(response, body)) return;
                lastError = new Error(`${path} returned stale or unsafe content`);
              } catch (error) {
                lastError = error;
              }
              await sleep(5_000);
            }
            throw lastError ?? new Error(`${path} did not respond`);
          }

          await fetchWithRetry("/api/health", undefined, (_response, body) => {
            const health = JSON.parse(body);
            return health.status === "ok";
          });
          await fetchWithRetry(
            "/api/admin/build-info",
            { headers: { authorization: `Bearer ${process.env.ADMIN_DIAGNOSTICS_TOKEN}` } },
            (_response, body) => JSON.parse(body).gitSha === process.env.EXPECTED_GIT_SHA,
          );
          await fetchWithRetry("/protocols", undefined, (response, body) =>
            body.includes("Morning outdoor cue") &&
            !body.includes("Unpublished evening revision") &&
            response.headers.get("content-security-policy")?.includes("'strict-dynamic'") === true,
          );
          await fetchWithRetry("/privacy", undefined, (_response, body) =>
            body.includes("Privacy in the invite-only beta") && body.includes("seven calendar days"),
          );
          await fetchWithRetry("/account-deletion", undefined, (_response, body) =>
            body.includes("Request complete account deletion"),
          );
          await fetchWithRetry("/sign-in", undefined, (response, body) =>
            body.includes("Sign in with your invitation") &&
            response.headers.get("cache-control")?.includes("no-store") === true,
          );
          console.log("Production Worker, build identity, catalog, privacy, and sign-in verified.");
          NODE
